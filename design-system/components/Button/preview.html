<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title>
<style>body{margin:0;background:var(--bg);font-family:var(--font-sans)} #root{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px}</style></head>
<body>
<div id="root"></div>
<script>
  var K = window.KabinetDS, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.Button, { type: 'Primary' }, 'Выбрать'),
    h(K.Button, { type: 'Accent' }, 'Оформить'),
    h(K.Button, { type: 'Outline' }, 'Подробнее'),
    h(K.Button, { type: 'Sort' }, 'По доходности'),
    h(K.Button, { type: 'WithIcon' }, 'Все стратегии')));
</script>
</body>
</html>
